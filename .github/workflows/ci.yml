name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-gemini.txt

      - name: Import the Gemini writer
        run: python -c "import gemini_writer, podcastfy.client"

      - name: Fetch the latest edition
        run: python tldr_podcast.py fetch

      - name: Voice a two-turn transcript
        run: |
          mkdir -p episodes/ci
          printf '<Person1>Welcome to TLDR Daily.</Person1>\n<Person2>Good to be here.</Person2>\n' > episodes/ci/transcript.txt
          python tldr_podcast.py voice ci
          test -s episodes/ci/tldr-ci.mp3
