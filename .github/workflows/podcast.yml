name: TLDR Daily Podcast

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      post:
        description: Post to Discord (off generates the MP3 as an artifact only)
        type: boolean
        default: false
      force:
        description: Regenerate even if the latest edition was already posted
        type: boolean
        default: false
      attempt:
        description: Set by automatic retries, leave at 1
        type: number
        default: 1

concurrency:
  group: podcast
  cancel-in-progress: false

env:
  POST: ${{ github.event_name == 'schedule' || inputs.post }}
  ATTEMPT: ${{ inputs.attempt || 1 }}
  MAX_ATTEMPTS: 3

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # last_edition.txt in the repo is only the seed; the real state lives in the cache,
      # so posting never needs a commit to main.
      - name: Restore last posted edition
        uses: actions/cache/restore@v4
        with:
          path: last_edition.txt
          key: tldr-state-${{ github.run_id }}
          restore-keys: tldr-state-

      - name: Check for a new edition
        id: check
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          latest=$(curl -fsSL https://tldr.tech/api/rss/tech | grep -oE 'https://tldr.tech/tech/[0-9-]+' | head -1 | sed 's#.*/##')
          done=$(cat last_edition.txt)
          echo "latest=$latest done=$done"
          if [ "$latest" != "$done" ] || [ "$FORCE" = "true" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.new == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.new == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          pip install -r requirements.txt

      - name: Generate podcast
        if: steps.check.outputs.new == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tldr_podcast.py $( [ "$POST" = "true" ] && echo --post ) --force

      - name: Upload episode and transcript
        if: always() && steps.check.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tldr-${{ steps.check.outputs.date }}-${{ github.run_id }}
          path: |
            episodes/*.mp3
            episodes/transcripts/*.txt
          retention-days: 7

      - name: Remember posted edition
        if: steps.check.outputs.new == 'true' && (github.event_name == 'schedule' || inputs.post)
        uses: actions/cache/save@v4
        with:
          path: last_edition.txt
          key: tldr-state-${{ steps.check.outputs.date }}-${{ github.run_id }}

      - name: Say the episode made it after all
        if: steps.check.outputs.new == 'true' && env.POST == 'true' && env.ATTEMPT != '1'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          jq -n --arg msg "✅ Recovered: the ${{ steps.check.outputs.date }} episode posted on attempt $ATTEMPT." \
            '{content: $msg}' | curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"

  # A failed episode isn't remembered, so a later run would retry it anyway, but GitHub
  # delays the hourly schedule by 4-6 hours. Alert right away and retry sooner.
  retry:
    needs: podcast
    if: ${{ !cancelled() && needs.podcast.result != 'success' && (github.event_name == 'schedule' || inputs.post) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Alert on Discord
        continue-on-error: true
        run: |
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            next="retrying in 30 minutes (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
          else
            next="giving up after $MAX_ATTEMPTS attempts, the next scheduled run will try again"
          fi
          jq -n --arg msg "⚠️ Today's episode failed, $next. Log: $RUN_URL" \
            '{content: $msg}' | curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"

      - name: Retry later
        run: |
          [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] || exit 0
          sleep 1800
          gh workflow run podcast.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f post=true -f attempt=$((ATTEMPT + 1))
