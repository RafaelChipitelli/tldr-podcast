name: TLDR Daily Podcast (fallback)

# Claude writes and posts each episode in a cloud routine (docs/episode-session.md). This
# workflow is the fallback: from a few hours after the routine's slot it checks hourly,
# and when the latest edition isn't recorded as posted on the editions-data branch, Gemini
# writes the episode instead. GitHub runs hourly schedules only every few hours, so the
# window is wide.
on:
  schedule:
    - cron: "5 15-23 * * 1-5"
  workflow_dispatch:
    inputs:
      post:
        description: Post to Discord (off generates the MP3 as an artifact only)
        type: boolean
        default: false
      force:
        description: Regenerate and post even if the latest edition was already posted
        type: boolean
        default: false

concurrency:
  group: podcast
  cancel-in-progress: false

permissions:
  contents: write # post records the edition on the editions-data branch

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the light dependencies
        run: pip install -r requirements.txt

      - name: Check for a new edition
        id: check
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          status=$(python tldr_podcast.py fetch | tail -1)
          echo "$status"
          if [ "${status%% *}" = "new" ] || [ "$FORCE" = "true" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "date=${status#* }" >> "$GITHUB_OUTPUT"

      - name: Install Podcastfy
        if: steps.check.outputs.new == 'true'
        run: pip install -r requirements-gemini.txt

      - name: Write the transcript with Gemini
        if: steps.check.outputs.new == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_writer.py "${{ steps.check.outputs.date }}"

      - name: Voice it
        if: steps.check.outputs.new == 'true'
        run: python tldr_podcast.py voice "${{ steps.check.outputs.date }}"

      - name: Post to Discord
        if: steps.check.outputs.new == 'true' && (github.event_name == 'schedule' || inputs.post)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python tldr_podcast.py post "${{ steps.check.outputs.date }}" $( [ "$FORCE" = "true" ] && echo --force )

      - name: Upload episode and transcript
        if: always() && steps.check.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tldr-${{ steps.check.outputs.date }}-${{ github.run_id }}
          path: episodes/${{ steps.check.outputs.date }}/
          retention-days: 7
